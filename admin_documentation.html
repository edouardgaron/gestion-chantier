<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documentation projet — Admin — InnovaSpray Québec</title>
  <script src="isq-storage.js"></script>
  <script src="isq-auth.js"></script>
  <script src="isq-api.js"></script>
  <script>ISQAuth.requireAdmin();</script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bleu:#0170B9; --bleu-f:#014d82; --orange:#FF6600; --gris:#F4F6F9; --bordure:#D0D7E3; --texte:#1A1A2E; --vert:#2E7D32; --rouge:#C62828; --jaune:#8a6d00; }
    body { font-family:'Montserrat','Segoe UI',Arial,sans-serif; background:#EEF1F5; color:var(--texte); font-size:14px; line-height:1.5; padding-bottom:40px; }

    .navbar { background:linear-gradient(135deg,var(--bleu) 0%,var(--bleu-f) 100%); color:#fff; padding:12px 18px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; position:sticky; top:0; z-index:20; box-shadow:0 2px 10px rgba(0,0,0,.12); }
    .navbar .back { color:#fff; text-decoration:none; font-size:20px; background:rgba(255,255,255,.15); border-radius:8px; padding:6px 11px; flex-shrink:0; }
    .navbar .nav-titles { min-width:0; flex:1 1 auto; }
    .navbar .title { font-size:16px; font-weight:800; }
    .navbar .subtitle { font-size:11px; opacity:.82; }

    .wrap { max-width:1080px; margin:18px auto; padding:0 16px; }
    .intro { font-size:13px; color:#666; margin:0 2px 14px; }
    .loading-msg, .empty { text-align:center; padding:34px; color:#999; }

    /* Projet (accordéon) */
    .project { background:#fff; border-radius:12px; box-shadow:0 3px 14px rgba(0,0,0,.07); margin-bottom:14px; overflow:hidden; }
    .project-head { display:flex; align-items:center; gap:12px; padding:16px 18px; cursor:pointer; user-select:none; }
    .project-head:hover { background:#fafbfd; }
    .project-head .pj-icon { width:42px; height:42px; border-radius:10px; background:#eef4fb; color:var(--bleu); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
    .project-head .pj-main { flex:1; min-width:0; }
    .project-head .pj-title { font-size:16px; font-weight:800; }
    .project-head .pj-sub { font-size:12px; color:#777; margin-top:2px; }
    .project-head .chev { font-size:14px; color:#999; transition:transform .2s; }
    .project.open .project-head .chev { transform:rotate(180deg); }
    .project-body { display:none; border-top:1px solid var(--gris); padding:6px 0; }
    .project.open .project-body { display:block; }

    /* Compte rendu (jour) */
    .day { padding:14px 18px; border-bottom:1px solid var(--gris); }
    .day:last-child { border-bottom:none; }
    .day-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
    .day-date { font-size:14px; font-weight:800; color:var(--texte); }
    .day-meta { font-size:12px; color:#777; }
    .status-badge { font-size:10px; font-weight:800; padding:3px 9px; border-radius:99px; text-transform:uppercase; letter-spacing:.3px; }
    .st-envoye{background:#e8f5e9;color:var(--vert);} .st-erreur{background:#fdecea;color:var(--rouge);} .st-brouillon{background:#fff8e1;color:var(--jaune);}
    .day-cost { font-size:12px; font-weight:700; color:var(--bleu); margin-left:auto; }

    .pdf-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; margin-bottom:12px; }
    .pdf-card { border:1px solid var(--bordure); border-radius:10px; padding:12px; display:flex; flex-direction:column; gap:8px; background:#fcfdfe; }
    .pdf-card .pdf-name { font-size:13px; font-weight:700; display:flex; align-items:center; gap:8px; }
    .pdf-card .pdf-name .ic { color:var(--rouge); font-size:18px; }
    .pdf-card .pdf-size { font-size:11px; color:#999; }
    .pdf-actions { display:flex; gap:6px; margin-top:2px; }
    .mini { flex:1; text-align:center; padding:8px; border-radius:7px; font-size:12px; font-weight:700; cursor:pointer; text-decoration:none; border:none; font-family:inherit; }
    .mini-view { background:#eef4fb; color:var(--bleu); border:1px solid #cfe0f2; }
    .mini-dl { background:var(--bleu); color:#fff; }
    .mini-view:hover{background:#e0ecf8;} .mini-dl:hover{background:var(--bleu-f);}
    .no-pdf { font-size:12px; color:#c0392b; padding:8px 0; }

    .day-actions { display:flex; gap:8px; flex-wrap:wrap; }
    .btn { padding:9px 14px; border-radius:8px; font-family:inherit; font-size:12px; font-weight:700; cursor:pointer; border:none; white-space:nowrap; }
    .btn-zip { background:#fff; color:var(--bleu); border:2px solid var(--bleu); }
    .btn-regen { background:#fff; color:var(--jaune); border:2px solid #e0b400; }
    .btn-resend { background:var(--orange); color:#fff; }
    .btn:disabled { opacity:.6; cursor:default; }
    .act-status { font-size:12px; font-weight:700; align-self:center; }

    /* Modal prévisualisation PDF */
    .overlay { position:fixed; inset:0; background:rgba(20,30,45,.6); display:none; align-items:center; justify-content:center; z-index:50; padding:16px; }
    .overlay.open { display:flex; }
    .viewer { background:#fff; border-radius:12px; width:100%; max-width:900px; height:90vh; display:flex; flex-direction:column; overflow:hidden; }
    .viewer-head { background:var(--bleu); color:#fff; padding:12px 18px; display:flex; align-items:center; justify-content:space-between; }
    .viewer-head .vt { font-size:14px; font-weight:800; }
    .viewer-head button { background:rgba(255,255,255,.18); border:none; color:#fff; width:32px; height:32px; border-radius:8px; font-size:18px; cursor:pointer; }
    .viewer iframe { flex:1; border:none; width:100%; }
  </style>
</head>
<body>

<div class="navbar">
  <a href="index.html" class="back">←</a>
  <div class="nav-titles">
    <div class="title">Documentation projet</div>
    <div class="subtitle">PDF générés automatiquement — par chantier</div>
  </div>
</div>

<div class="wrap">
  <div class="intro">Chaque compte rendu génère 4 documents PDF (Bon de travail, Fiche de chantier, Suivi des matériaux, Rapport complet), archivés automatiquement par chantier.</div>
  <div id="list"><div class="loading-msg">Chargement…</div></div>
</div>

<!-- Modal prévisualisation -->
<div class="overlay" id="viewerOverlay" onclick="if(event.target===this) closeViewer()">
  <div class="viewer">
    <div class="viewer-head">
      <span class="vt" id="viewerTitle">Document</span>
      <button onclick="closeViewer()">✕</button>
    </div>
    <iframe id="viewerFrame" src="about:blank"></iframe>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  ISQApi.get('/api/session/me').then(function (r) { if (r.ok) loadDocs(); });
});

async function loadDocs() {
  var r = await ISQApi.get('/api/documentation');
  if (!r.ok) { document.getElementById('list').innerHTML = '<div class="empty">Erreur de chargement.</div>'; return; }
  render(r.data);
}

function render(projects) {
  var list = document.getElementById('list');
  if (!projects.length) { list.innerHTML = '<div class="project empty">Aucun document. Les PDF apparaîtront ici dès qu\'un employé enverra un compte rendu.</div>'; return; }
  list.innerHTML = '';
  projects.forEach(function (pj, pi) {
    var nbDocs = pj.reports.reduce(function (n, r) { return n + (r.pdfs ? r.pdfs.length : 0); }, 0);
    var div = document.createElement('div');
    div.className = 'project' + (pi === 0 ? ' open' : '');
    var daysHtml = pj.reports.map(function (rep) { return dayHtml(rep); }).join('');
    div.innerHTML =
      '<div class="project-head">' +
        '<div class="pj-icon">📁</div>' +
        '<div class="pj-main">' +
          '<div class="pj-title">' + esc(pj.project || 'Sans projet') + (pj.job_number && pj.project !== pj.job_number ? ' <span style="color:#999;font-weight:600;">(' + esc(pj.job_number) + ')</span>' : '') + '</div>' +
          '<div class="pj-sub">' + pj.reports.length + ' compte' + (pj.reports.length > 1 ? 's' : '') + ' rendu' + (pj.reports.length > 1 ? 's' : '') + ' • ' + nbDocs + ' document' + (nbDocs > 1 ? 's' : '') + ' PDF</div>' +
        '</div>' +
        '<div class="chev">▾</div>' +
      '</div>' +
      '<div class="project-body">' + daysHtml + '</div>';
    div.querySelector('.project-head').addEventListener('click', function () { div.classList.toggle('open'); });
    list.appendChild(div);
  });
}

function dayHtml(rep) {
  var token = ISQApi.getToken();
  var stClass = rep.status === 'envoye' ? 'st-envoye' : (rep.status === 'erreur' ? 'st-erreur' : 'st-brouillon');
  var stLabel = rep.status === 'envoye' ? '✓ Envoyé' : (rep.status === 'erreur' ? '✕ Erreur' : '⋯ Brouillon');
  var cost = (rep.day_cost != null && rep.day_cost !== '') ? ('💲 ' + Number(rep.day_cost).toLocaleString('fr-CA', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' $') : '';

  var pdfsHtml;
  if (rep.pdfs && rep.pdfs.length) {
    pdfsHtml = '<div class="pdf-grid">' + rep.pdfs.map(function (p) {
      var url = '/api/daily-reports/' + rep.id + '/pdf/' + p.type + '?token=' + encodeURIComponent(token);
      var kb = p.size ? Math.round(p.size / 1024) + ' Ko' : '';
      return '<div class="pdf-card">' +
        '<div class="pdf-name"><span class="ic">📄</span>' + esc(p.label) + '</div>' +
        '<div class="pdf-size">' + kb + '</div>' +
        '<div class="pdf-actions">' +
          '<button class="mini mini-view" onclick="preview(\'' + url + '\',\'' + esc(p.label) + '\')">👁 Voir</button>' +
          '<a class="mini mini-dl" href="' + url + '&download=1">⬇ Télécharger</a>' +
        '</div>' +
      '</div>';
    }).join('') + '</div>';
  } else {
    pdfsHtml = '<div class="no-pdf">Aucun PDF généré. Cliquez « Régénérer ».</div>';
  }

  var zipUrl = '/api/daily-reports/' + rep.id + '/pdf-zip?token=' + encodeURIComponent(token);
  return '<div class="day" id="day-' + rep.id + '">' +
    '<div class="day-head">' +
      '<span class="day-date">📅 ' + esc(rep.report_date || '') + '</span>' +
      '<span class="status-badge ' + stClass + '">' + stLabel + '</span>' +
      '<span class="day-meta">👷 ' + esc(rep.employee_name || '') + (rep.hours_worked ? (' • ⏱️ ' + esc(rep.hours_worked) + ' h') : '') + '</span>' +
      (cost ? '<span class="day-cost">' + cost + '</span>' : '') +
    '</div>' +
    pdfsHtml +
    '<div class="day-actions">' +
      (rep.pdfs && rep.pdfs.length ? '<a class="btn btn-zip" href="' + zipUrl + '">⬇ Tout télécharger (zip)</a>' : '') +
      '<button class="btn btn-regen" onclick="regen(' + rep.id + ', this)">🔄 Régénérer les PDF</button>' +
      '<button class="btn btn-resend" onclick="resend(' + rep.id + ', this)">📧 Renvoyer le courriel</button>' +
      '<span class="act-status" id="actst-' + rep.id + '"></span>' +
    '</div>' +
  '</div>';
}

function preview(url, title) {
  document.getElementById('viewerTitle').textContent = title;
  document.getElementById('viewerFrame').src = url;
  document.getElementById('viewerOverlay').classList.add('open');
}
function closeViewer() {
  document.getElementById('viewerOverlay').classList.remove('open');
  document.getElementById('viewerFrame').src = 'about:blank';
}

async function regen(id, btn) {
  var st = document.getElementById('actst-' + id);
  btn.disabled = true; st.style.color = 'var(--jaune)'; st.textContent = '⏳ Régénération…';
  var r = await ISQApi.post('/api/daily-reports/' + id + '/regenerate', {});
  btn.disabled = false;
  if (r.ok && r.data.ok) { st.style.color = 'var(--vert)'; st.textContent = '✓ PDF régénérés'; loadDocs(); }
  else { st.style.color = 'var(--rouge)'; st.textContent = '✕ ' + (r.data.error || 'Échec'); }
}

async function resend(id, btn) {
  var st = document.getElementById('actst-' + id);
  btn.disabled = true; st.style.color = 'var(--jaune)'; st.textContent = '⏳ Envoi…';
  var r = await ISQApi.post('/api/daily-reports/' + id + '/resend', {});
  btn.disabled = false;
  if (r.ok && r.data.status === 'envoye') { st.style.color = 'var(--vert)'; st.textContent = '✓ ' + (r.data.message || 'Renvoyé'); loadDocs(); }
  else { st.style.color = 'var(--rouge)'; st.textContent = '✕ ' + (r.data && (r.data.error || r.data.message) ? (r.data.error || r.data.message) : 'Échec'); }
}

function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
</script>

</body>
</html>
